<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        .container { font-family: sans-serif; max-width: 600px; margin: auto; border: 1px solid #eee; padding: 20px; }
        .header { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .content { margin-top: 20px; color: #555; line-height: 1.5; }
        .footer { margin-top: 30px; font-size: 12px; color: #888; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header" th:text="${title}">Título por defecto</h1>
        <div class="content">
            <p>Hola <strong th:text="${userName}">Usuario</strong>,</p>
            <p th:text="${description}">Descripción del mensaje...</p>
        </div>
        <div class="footer">
            <p>Este es un correo automático, por favor no respondas.</p>
        </div>
    </div>
</body>
</html>
